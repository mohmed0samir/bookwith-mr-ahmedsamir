<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الحجوزات | الأستاذ أحمد سمير</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{overflow:auto}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:90;background:var(--char);color:var(--ivory);display:grid;place-items:center;padding:1.2rem}
.gate-box{width:100%;max-width:400px}
.gate h1{font-size:2rem;margin-bottom:.4rem}.gate p{color:#cfc7b8;margin-bottom:1.6rem;font-size:.95rem}
.gate .f label{color:var(--gold)}.gate .f input{color:var(--ivory);border-color:#4a453f}.gate .f input:focus{border-color:var(--gold)}
.gate .btn{width:100%}.gate .alt{background:none;border:0;color:var(--gray);font:inherit;font-size:.88rem;margin-top:1.2rem;cursor:pointer;text-decoration:underline}
.gate .msg{color:#e58b7d;font-size:.9rem;min-height:1.4rem;margin-top:.8rem}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100svh}
.side{background:var(--char);color:var(--ivory);padding:1.6rem 1.2rem;display:flex;flex-direction:column;gap:1.4rem;position:sticky;top:0;height:100svh}
.side .brand{color:var(--ivory)}
.side nav{display:grid;gap:.2rem}
.side nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;padding:.7rem .8rem;color:#cfc7b8;border-inline-start:2px solid transparent;transition:.2s}
.side nav button:hover{color:var(--ivory)}
.side nav button[aria-current=true]{color:var(--gold);border-color:var(--gold);background:rgba(200,169,107,.08)}
.side nav button:focus-visible{outline:2px solid var(--gold)}
.side .foot2{margin-top:auto;display:grid;gap:.6rem}
.side .btn{min-height:42px;font-size:.88rem;background:transparent;border-color:#4a453f;color:var(--ivory)}
.side .btn:hover{background:var(--ivory);color:var(--char);border-color:var(--ivory)}
.main{padding:1.4rem clamp(1rem,3vw,2.4rem) 4rem;min-width:0}
.top{display:flex;align-items:center;gap:1rem;margin-bottom:1.6rem}
.top h1{font-size:clamp(1.5rem,3vw,2.2rem);flex:1}
#menuBtn{display:none;min-height:44px;padding:0 1rem}
.live-dot{font-size:.85rem;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);margin-bottom:1.6rem;background:var(--paper)}
.stat{padding:1rem 1.1rem;border-inline-start:1px solid var(--line)}.stat:first-child{border:0}
.stat b{display:block;font:800 1.9rem var(--f-display);line-height:1.2}.stat span{font-size:.85rem;color:var(--gray)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:1rem;align-items:end;margin-bottom:1.2rem}
.filters .f{margin:0}
.list{border-top:1.5px solid var(--char)}
.bk-row{display:grid;grid-template-columns:2fr 1.4fr 1.3fr 1fr auto;gap:1rem;align-items:center;padding:1rem .4rem;border-bottom:1px solid var(--line)}
.bk-row:hover{background:var(--paper)}
.bk-row strong{display:block}.bk-row small{color:var(--gray)}
.st{font-size:.82rem;font-weight:600;padding:.2rem .7rem;border:1px solid currentColor;display:inline-block}
.st.pending{color:var(--bronze)}.st.confirmed{color:var(--ok)}.st.cancelled{color:var(--danger)}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.acts button,.acts a{min-height:38px;padding:0 .8rem;border:1px solid var(--line);background:transparent;font:500 .85rem var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;color:var(--char)}
.acts button:hover,.acts a:hover{background:var(--char);color:var(--ivory)}
.acts .dng:hover{background:var(--danger);border-color:var(--danger)}
.sk{height:64px;margin:.5rem 0;background:linear-gradient(90deg,#e9e3d6 25%,#f4efe6 50%,#e9e3d6 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:4rem 1rem;color:var(--gray)}.empty h2{color:var(--char);font-size:1.5rem;margin-bottom:.4rem}
.ov{position:fixed;inset:0;z-index:80;background:rgba(29,27,25,.6);display:grid;place-items:center;padding:1rem}
.dlg{background:var(--ivory);width:100%;max-width:460px;padding:1.8rem;max-height:90svh;overflow:auto}
.dlg h2{font-size:1.4rem;margin-bottom:.8rem}.dlg dl div{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.dlg dt{color:var(--gray)}.dlg dd{font-weight:600;text-align:end}
.dlg .actions{margin-top:1.4rem}.dlg .btn{min-height:44px}
.btn.dng{background:var(--danger);border-color:var(--danger)}
#toasts{position:fixed;inset-inline:0;bottom:1rem;z-index:100;display:grid;gap:.5rem;justify-items:center;pointer-events:none}
.toast{background:var(--char);color:var(--ivory);padding:.8rem 1.3rem;animation:stepin .35s var(--ease);max-width:90vw}.toast.err{background:var(--danger)}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,86vw);z-index:70;transform:translateX(100%);transition:transform .3s var(--ease)}
 .side.open{transform:none}#menuBtn{display:inline-flex}
 .stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(odd){border-inline-start:0}.stat{border-top:1px solid var(--line)}.stat:nth-child(-n+2){border-top:0}
 .filters{grid-template-columns:1fr 1fr}.filters .f:first-child{grid-column:1/-1}
 .bk-row{grid-template-columns:1fr auto;gap:.5rem}.bk-row>:nth-child(n+3):not(.acts){grid-column:1/-1}.acts{grid-column:1/-1;justify-content:flex-start}
}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <h1>لوحة الحجوزات</h1><p id="gateSub">خاصة بالأستاذ أحمد سمير.</p>
    <form id="authForm">
      <div class="f"><label for="email">البريد الإلكتروني</label><input id="email" type="email" dir="ltr" autocomplete="username" style="text-align:right"></div>
      <div class="f"><label for="pass">كلمة المرور</label><input id="pass" type="password" dir="ltr" autocomplete="current-password" style="text-align:right"></div>
      <button class="btn gold" id="authBtn" type="submit">دخول</button>
    </form>
    <form id="codeForm" hidden>
      <div class="f"><label for="code">كود الدخول القديم</label><input id="code" type="password" inputmode="numeric" autocomplete="off"></div>
      <button class="btn gold" type="submit">دخول</button>
    </form>
    <p class="msg" id="gateMsg" role="alert"></p>
    <button class="alt" id="modeBtn" type="button">الدخول بالكود القديم</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="القائمة">
    <a class="brand" href="index.html"><img src="logo.jpg" alt="" width="34" height="34"><span>أحمد سمير</span></a>
    <nav id="navF" aria-label="تصنيف الحجوزات">
      <button data-v="all" aria-current="true">كل الحجوزات <i id="n-all">0</i></button>
      <button data-v="today">اليوم <i id="n-today">0</i></button>
      <button data-v="upcoming">القادمة <i id="n-upcoming">0</i></button>
      <button data-v="pending">قيد الانتظار <i id="n-pending">0</i></button>
      <button data-v="confirmed">المؤكدة <i id="n-confirmed">0</i></button>
      <button data-v="cancelled">الملغاة <i id="n-cancelled">0</i></button>
    </nav>
    <div class="foot2">
      <button class="btn" id="syncBtn" type="button">مزامنة المواعيد القديمة</button>
      <a class="btn" href="booking.html">صفحة الحجز</a>
      <button class="btn" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
  </aside>
  <main class="main">
    <div class="top"><button class="btn ghost" id="menuBtn" aria-label="القائمة">☰</button><h1 id="viewTitle">كل الحجوزات</h1><span class="live-dot">● مباشر</span></div>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <div class="f"><label for="q">بحث</label><input id="q" type="search" placeholder="اسم الطالب أو ولي الأمر"></div>
      <div class="f"><label for="df">التاريخ</label><input id="df" type="date"></div>
      <div class="f"><label for="sf">الحالة</label><select id="sf"><option value="">الكل</option><option value="pending">قيد الانتظار</option><option value="confirmed">مؤكد</option><option value="cancelled">ملغي</option></select></div>
      <button class="btn ghost" id="clr" type="button">مسح</button>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
  </main>
</div>
<div id="toasts" role="status"></div>
<div class="ov" id="ov" hidden><div class="dlg" role="dialog" aria-modal="true" id="dlg"></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cfg={apiKey:"AIzaSyDItPfiy7VZNHgjTSdvggw9iZgDKxNPQOo",authDomain:"logg-d33e6.firebaseapp.com",databaseURL:"https://logg-d33e6-default-rtdb.europe-west1.firebasedatabase.app",projectId:"logg-d33e6",storageBucket:"logg-d33e6.firebasestorage.app",messagingSenderId:"815537285421",appId:"1:815537285421:web:196f7fa2061dfcaacbcba4"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.database(), auth=firebase.auth();
const SL={'9:00 ص - 10:00 ص':9,'10:00 ص - 11:00 ص':10,'11:00 ص - 12:00 م':11,'12:00 م - 1:00 م':12,'1:00 م - 2:00 م':13,'2:00 م - 3:00 م':14,'3:00 م - 4:00 م':15,'4:00 م - 5:00 م':16,'5:00 م - 6:00 م':17,'6:00 م - 7:00 م':18};
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo'}).format(new Date());
const LBL={pending:'قيد الانتظار',confirmed:'مؤكد',cancelled:'ملغي'};
const slotKey=b=>b.slotKey||(SL[b.bookingTime]!=null?'h'+SL[b.bookingTime]:null);
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>t.remove(),3600)}
const perm=e=>e&&/permission/i.test(e.message||'');
function fail(e){console.error(e);toast(perm(e)?'ليست لديك صلاحية لهذه العملية. سجّل الدخول بالبريد الإلكتروني.':'تعذّرت العملية، تحقق من الاتصال وأعد المحاولة.',true)}

/* ---- الدخول ---- */
let mode='email',opened=false;
const msg=t=>$('gateMsg').textContent=t||'';
$('modeBtn').onclick=()=>{mode=mode==='email'?'code':'email';$('authForm').hidden=mode!=='email';$('codeForm').hidden=mode!=='code';$('modeBtn').textContent=mode==='email'?'الدخول بالكود القديم':'الدخول بالبريد الإلكتروني';msg()};
$('authForm').onsubmit=async e=>{e.preventDefault();msg();$('authBtn').disabled=true;
  try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('pass').value)}
  catch(er){msg(/network/.test(er.code||'')?'تعذّر الاتصال بالإنترنت.':/too-many/.test(er.code||'')?'محاولات كثيرة، انتظر قليلًا.':/operation-not-allowed|configuration/.test(er.code||'')?'تسجيل الدخول بالبريد غير مفعّل في Firebase بعد.':'البريد أو كلمة المرور غير صحيحة.')}
  finally{$('authBtn').disabled=false}};
const sha=async t=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))).map(b=>b.toString(16).padStart(2,'0')).join('');
$('codeForm').onsubmit=async e=>{e.preventDefault();msg();
  try{const s=await db.ref('settings/accessCodeHash').once('value');
    if(!s.exists()){msg('لا يوجد كود قديم مسجّل. استخدم الدخول بالبريد.');return}
    if(s.val()===await sha($('code').value)){sessionStorage.setItem('teacherAccess','1');open()}else msg('الكود غير صحيح.')}
  catch(er){msg(perm(er)?'الكود القديم متوقف بعد تشديد الصلاحيات. استخدم الدخول بالبريد.':'تعذّر الاتصال بقاعدة البيانات.')}};
auth.onAuthStateChanged(u=>{if(u)open();else if(sessionStorage.getItem('teacherAccess')==='1')open();else{$('gate').hidden=false;$('app').hidden=true}});
$('logoutBtn').onclick=async()=>{sessionStorage.removeItem('teacherAccess');try{await auth.signOut()}catch(e){}location.reload()};

/* ---- البيانات ---- */
let all=[],view='all';
function open(){if(opened)return;opened=true;$('gate').hidden=true;$('app').hidden=false;
  $('list').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  db.ref('bookings').on('value',s=>{all=[];s.forEach(c=>{all.push({id:c.key,...c.val()})});
    all.sort((a,b)=>(a.bookingDate||'').localeCompare(b.bookingDate||'')||(SL[a.bookingTime]||0)-(SL[b.bookingTime]||0));render()},
    e=>{$('list').innerHTML=`<div class="empty"><h2>تعذّر تحميل الحجوزات</h2><p>${perm(e)?'لا تملك صلاحية القراءة. سجّل الدخول بالبريد الإلكتروني.':'تحقق من الاتصال بالإنترنت.'}</p></div>`})}
const st=b=>b.status||'pending';
function match(b,v){const t=today(),s=st(b);
  return v==='all'||(v==='today'&&b.bookingDate===t)||(v==='upcoming'&&b.bookingDate>=t&&s!=='cancelled')||s===v}
function render(){
  const t=today(),c=k=>all.filter(b=>match(b,k)).length;
  [['all','الإجمالي'],['today','اليوم'],['upcoming','القادمة'],['pending','قيد الانتظار'],['confirmed','المؤكدة'],['cancelled','الملغاة']].forEach(([k])=>{$('n-'+k).textContent=c(k)});
  $('stats').innerHTML=[['all','إجمالي الحجوزات'],['today','حجوزات اليوم'],['upcoming','القادمة'],['pending','قيد الانتظار'],['confirmed','المؤكدة'],['cancelled','الملغاة']].map(([k,l])=>`<div class="stat"><b>${c(k)}</b><span>${l}</span></div>`).join('');
  const q=$('q').value.trim().toLowerCase(),d=$('df').value,sf=$('sf').value;
  const list=all.filter(b=>match(b,view)&&(!q||(b.studentName||'').toLowerCase().includes(q)||(b.parentName||'').toLowerCase().includes(q))&&(!d||b.bookingDate===d)&&(!sf||st(b)===sf));
  if(!list.length){$('list').innerHTML=`<div class="empty"><h2>${all.length?'لا توجد نتائج مطابقة':'لا توجد حجوزات بعد'}</h2><p>${all.length?'غيّر البحث أو الفلاتر.':'ستظهر الحجوزات الجديدة هنا فور وصولها.'}</p></div>`;return}
  $('list').innerHTML=list.map(b=>{const s=st(b);return `<div class="bk-row"><div><strong>${esc(b.studentName||'بدون اسم')}</strong><small>${esc(b.grade||'')}</small></div>
  <div>${esc(b.bookingDate||'-')}<br><small>${esc(b.bookingTime||'-')}</small></div><div>${esc(b.parentName||'-')}<br><small dir="ltr">${esc(b.parentPhone||'')}</small></div>
  <div><span class="st ${s}">${LBL[s]}</span></div>
  <div class="acts"><button data-a="view" data-id="${b.id}">تفاصيل</button>${s!=='confirmed'?`<button data-a="confirm" data-id="${b.id}">تأكيد</button>`:''}${s!=='cancelled'?`<button data-a="cancel" data-id="${b.id}">إلغاء</button>`:''}<button class="dng" data-a="del" data-id="${b.id}">حذف</button></div></div>`}).join('')}
['q','df','sf'].forEach(i=>$(i).addEventListener('input',render));
$('clr').onclick=()=>{$('q').value='';$('df').value='';$('sf').value='';render()};
$('navF').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;$('viewTitle').textContent=b.firstChild.textContent.trim();
  [...$('navF').children].forEach(x=>x.setAttribute('aria-current',x===b));$('side').classList.remove('open');render()};
$('menuBtn').onclick=()=>$('side').classList.toggle('open');

/* ---- نوافذ ---- */
function dialog(html){return new Promise(res=>{$('dlg').innerHTML=html;$('ov').hidden=false;const done=v=>{$('ov').hidden=true;$('dlg').innerHTML='';res(v)};
  $('dlg').onclick=e=>{const b=e.target.closest('[data-r]');if(b)done(b.dataset.r==='1')};$('ov').onclick=e=>{if(e.target===$('ov'))done(false)};
  document.onkeydown=e=>{if(e.key==='Escape'&&!$('ov').hidden)done(false)};const f=$('dlg').querySelector('button');f&&f.focus()})}
const ask=(t,m,ok,danger)=>dialog(`<h2>${t}</h2><p>${m}</p><div class="actions"><button class="btn ghost" data-r="0">رجوع</button><button class="btn ${danger?'dng':''}" data-r="1">${ok}</button></div>`);
function details(b){const s=st(b),p=(b.parentPhone||'').replace(/\D/g,''),wa=p.startsWith('0')?'2'+p:p;
  dialog(`<h2>${esc(b.studentName)}</h2><dl>${[['الحالة',LBL[s]],['ولي الأمر',esc(b.parentName)],['الهاتف',`<span dir="ltr">${esc(b.parentPhone)}</span>`],['البريد',esc(b.studentEmail)],['الصف',esc(b.grade)],['التاريخ',esc(b.bookingDate)],['الوقت',esc(b.bookingTime)],['ملاحظات',esc(b.notes)]].map(([k,v])=>`<div><dt>${k}</dt><dd>${v||'-'}</dd></div>`).join('')}</dl>
  <div class="actions acts" style="justify-content:space-between"><a class="btn ghost" href="tel:${esc(p)}">اتصال</a><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}">واتساب</a><button class="btn" data-r="0">إغلاق</button></div>`)}

/* ---- العمليات ---- */
const freeSlot=b=>{const k=slotKey(b);return k&&b.bookingDate?db.ref(`slots/${b.bookingDate}/${k}`).remove():Promise.resolve()};
async function claim(b){const k=slotKey(b);if(!k)return true;const r=await db.ref(`slots/${b.bookingDate}/${k}`).transaction(c=>c?undefined:true);return r.committed}
$('list').onclick=async e=>{const x=e.target.closest('button[data-a]');if(!x)return;const b=all.find(i=>i.id===x.dataset.id);if(!b)return;const a=x.dataset.a;
  try{
   if(a==='view')details(b);
   else if(a==='confirm'){const was=st(b);if(was==='cancelled'&&!await claim(b)){toast('هذا الموعد أُخذ بحجز آخر، لا يمكن إعادة تأكيد هذا الحجز.',true);return}
     await db.ref('bookings/'+b.id+'/status').set('confirmed');toast('تم تأكيد الحجز')}
   else if(a==='cancel'){if(await ask('إلغاء الحجز','سيتم إلغاء حجز '+esc(b.studentName)+' وإتاحة موعده لغيره.','إلغاء الحجز',true)){await db.ref('bookings/'+b.id+'/status').set('cancelled');await freeSlot(b);toast('تم إلغاء الحجز')}}
   else if(a==='del'){if(await ask('حذف نهائي','سيُحذف حجز '+esc(b.studentName)+' نهائيًا ولا يمكن التراجع.','حذف نهائيًا',true)){await freeSlot(b);await db.ref('bookings/'+b.id).remove();toast('تم حذف الحجز')}}
  }catch(er){fail(er)}};

/* ---- مزامنة الحجوزات القديمة مع slots ---- */
$('syncBtn').onclick=async()=>{
  if(!await ask('مزامنة المواعيد','ستُسجَّل مواعيد الحجوزات القديمة غير الملغاة في جدول المواعيد حتى لا تظهر متاحة. العملية آمنة ويمكن تكرارها.','ابدأ المزامنة'))return;
  let ok=0,dup=0,skip=0;
  try{for(const b of all){const k=slotKey(b);if(st(b)==='cancelled'||!k||!b.bookingDate||b.bookingDate<today()){skip++;continue}
      const r=await db.ref(`slots/${b.bookingDate}/${k}`).transaction(c=>c?undefined:true);
      if(r.committed){ok++;if(!b.slotKey)await db.ref('bookings/'+b.id+'/slotKey').set(k)}else if(!b.slotKey)dup++}
    toast(`تمت المزامنة: ${ok} موعد جديد، ${dup} متكرر أو مسجّل سابقًا، ${skip} متجاوز`)}catch(er){fail(er)}};
})();
</script>
</body>
</html>
